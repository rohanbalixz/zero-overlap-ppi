[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zop"
version = "0.1.0"
description = "Prediction-powered inference when the labelling probability is exactly zero: a CropGlobe study."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Rohan Bali"}]
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "pandas>=2.0",
  "matplotlib>=3.7",
]

[project.urls]
Repository = "https://github.com/rohanbalixz/zero-overlap-ppi"
"Technical note" = "https://github.com/rohanbalixz/zero-overlap-ppi/blob/main/docs/NOTE.md"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF100"]

[tool.ruff.lint.isort]
known-first-party = ["zop", "config", "transport"]
